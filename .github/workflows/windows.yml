name: Windows build

# Private repo: Windows minutes count double against the free 2,000/month, so PRs build only
# when they touch something that can break Windows. UI-only and docs changes skip it.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'crates/**'
      - 'src-tauri/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'ui/package*.json'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # dumpbin and lib, to make an MSVC import library for libmpv.
      - uses: ilammy/msvc-dev-cmd@v1

      # mpv publishes no Windows builds of its own; mpv.io points to shinchiro's. They are daily
      # and old ones get pruned, so take the latest and record exactly which file shipped.
      - name: Fetch libmpv (shinchiro/mpv-winbuild-cmake)
        shell: pwsh
        run: |
          $rel = gh api repos/shinchiro/mpv-winbuild-cmake/releases/latest | ConvertFrom-Json
          $asset = $rel.assets | Where-Object { $_.name -match '^mpv-dev-x86_64-\d' } | Select-Object -First 1
          if (-not $asset) { throw "no mpv-dev-x86_64 asset in release $($rel.tag_name)" }
          New-Item -ItemType Directory -Force mpv | Out-Null
          gh release download $rel.tag_name -R shinchiro/mpv-winbuild-cmake -p $asset.name -D mpv
          7z x "mpv/$($asset.name)" -ompv -y | Out-Null
          $sha = (Get-FileHash mpv/libmpv-2.dll -Algorithm SHA256).Hash.ToLower()
          "$($asset.name)`nlibmpv-2.dll sha256 $sha" | Set-Content mpv/VERSION.txt
          "libmpv: ``$($asset.name)``, libmpv-2.dll SHA-256 ``$sha``" >> $env:GITHUB_STEP_SUMMARY

      - name: Make mpv.lib from libmpv-2.dll's exports
        shell: pwsh
        run: |
          $names = dumpbin /exports mpv/libmpv-2.dll |
            Select-String '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(\S+)' |
            ForEach-Object { $_.Matches[0].Groups[1].Value }
          if ($names.Count -lt 50) { throw "only $($names.Count) exports found" }
          (@('LIBRARY libmpv-2.dll', 'EXPORTS') + $names) | Set-Content mpv/mpv.def
          lib /nologo /def:mpv/mpv.def /out:mpv/mpv.lib /machine:x64
          "LIB=$PWD\mpv;$env:LIB" >> $env:GITHUB_ENV
          Copy-Item mpv/libmpv-2.dll src-tauri/libmpv-2.dll

      - name: Install UI dependencies
        run: npm ci
        working-directory: ui

      # PRs only need "does it build and start"; the installer is made on main (and on demand).
      - name: Build
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'pull_request') {
            ui/node_modules/.bin/tauri.cmd build --no-bundle
          } else {
            ui/node_modules/.bin/tauri.cmd build
          }

      # The runner can't hear anything, so: does the app start, load mpv and the webview, and
      # stay up without errors? A missing DLL or a webview failure shows up here.
      - name: Smoke test
        shell: pwsh
        run: |
          Copy-Item mpv/libmpv-2.dll target/release/
          $p = Start-Process target/release/hum.exe -PassThru
          Start-Sleep 25
          $alive = -not $p.HasExited
          $log = "$env:LOCALAPPDATA/com.melihgurlek.hum/logs/hum.log"
          $text = if (Test-Path $log) { Get-Content $log -Raw } else { '' }
          if ($alive) { Stop-Process $p -Force }
          "--- hum.log ---"; $text
          if (-not $alive) { throw "hum.exe exited early with code $($p.ExitCode)" }
          if (-not $text) { throw "no log at $log" }
          if ($text -match 'panicked|\[ui\]|mpv thread died|mpv init') { throw "errors in the log" }
          if ($text -notmatch 'source warm') { throw "the engine never started (no 'source warm' line)" }

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: hum-windows-x64
          path: |
            target/release/bundle/nsis/*.exe
            mpv/VERSION.txt
          if-no-files-found: error
          # Artifact storage is 500 MB on the free plan; installers are ~40 MB each.
          retention-days: 7
