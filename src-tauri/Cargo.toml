[package]
name = "hum"
version = "0.1.0"
description = "Ad-free YouTube Music player"
authors = ["Melih Gürlek"]
license = "GPL-3.0-or-later"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "hum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
anyhow = "1"
hum-core = { path = "../crates/core" }
souvlaki = { version = "0.9", default-features = false, features = ["use_zbus"] }
tokio = { version = "1", features = ["sync", "fs", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
