[package]
name = "hum-spike"
version = "0.0.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
description = "Phase 1 spike: compare YouTube Music stream resolvers and measure click-to-sound"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
ytmusic = { git = "https://github.com/sonorahq/ytmusic-rs", rev = "db4ab87", optional = true }
rustypipe = { version = "0.11", optional = true }
reqwest = "0.12"
env_logger = "0.11"
log = "0.4"

[features]
# rustypipe and ytmusic-rs both bundle QuickJS and cannot link together:
# build with --features rp to test rustypipe instead of ytmusic-rs streams.
default = ["ytm"]
ytm = ["dep:ytmusic"]
rp = ["dep:rustypipe"]
