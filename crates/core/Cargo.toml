[package]
name = "hum-core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "hum: YouTube Music source, playback and queue, with no UI dependencies"

[dependencies]
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
# Fork of sonorahq/ytmusic-rs: upstream plus our fixes, offered back as PRs.
ytmusic = { git = "https://github.com/melihgurlek/ytmusic-rs", rev = "89b9ea9" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rusqlite = { version = "0.42", features = ["bundled"] }
serde_json = "1"
fastrand = "2"

# No mpv on Android: playback goes to the app's Media3 player (player_android.rs).
[target.'cfg(not(target_os = "android"))'.dependencies]
libmpv2 = "7"
# Only for mpv_wakeup, which libmpv2 doesn't wrap. Same version libmpv2 7 uses.
libmpv2-sys = "4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
env_logger = "0.11"
tokio = { version = "1", features = ["full"] }
