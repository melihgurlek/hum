[package]
name = "hum-core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "hum: YouTube Music source, playback and queue, with no UI dependencies"

[dependencies]
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
ytmusic = { git = "https://github.com/sonorahq/ytmusic-rs", rev = "db4ab87" }
libmpv2 = "7"

[dev-dependencies]
env_logger = "0.11"
tokio = { version = "1", features = ["full"] }
reqwest = "0.12"
